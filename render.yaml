# Render blueprint. The live service was created through the API, so these
# headers apply only once the blueprint is synced from the dashboard.
# Until then Render serves its default cache-control.
services:
  - type: web
    name: anteiku-rp
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
